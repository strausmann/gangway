version: "2"

# golangci-lint's built-in "standard" set already covers errcheck, govet,
# ineffassign, staticcheck and unused. revive is added explicitly for style
# and naming conventions. Deliberately no additional linters beyond this —
# a lean baseline that won't turn the first CI run red with style nitpicks.
linters:
  default: standard
  enable:
    - revive

# Both caps default to a nonzero value that silently truncates the report
# once too many issues share the same text or the same linter — a CI run
# can look clean while findings are hiding behind the cut-off. Set to 0
# (their documented "disable" value) so every finding is always shown.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
