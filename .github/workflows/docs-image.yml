name: docs-image
# Baut die Zensical-Dokumentation (docs/) zu einem schlanken nginx-Image und
# veroeffentlicht es in der GitHub Container Registry. Kein Build-Werkzeug im
# Runtime-Image -- nur die fertigen Seiten. Gezogen wird das Image von einem
# Dockhand-Git-Stack (infrastructure/docker/gangway-docs auf git.strausmann.de),
# bereitgestellt unter gangway.strausmann.cloud.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/strausmann/gangway-docs

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build-Zeitstempel
        id: timestamp
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.timestamp.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nur bei main-Push relevant: der Dockhand-Git-Stack zieht immer den
      # rollenden :main-Tag, dessen Compose-Datei sich dabei nie aendert --
      # ohne diesen Anstoss wuerde niemand automatisch merken, dass ein neues
      # Image bereitsteht (repullImages+forceRedeploy sind serverseitig am
      # Git-Stack gesetzt, siehe infrastructure/docker/gangway-docs). Das
      # Secret ist an genau diesen einen Stack gebunden (Wirkungsbereich).
      - name: Dockhand-Redeploy anstossen
        if: github.ref == 'refs/heads/main'
        env:
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_GANGWAY_DOCS_WEBHOOK_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/dockhand-webhook-response.json -w '%{http_code}' \
            "https://dock.strausmann.cloud/api/git/stacks/40/webhook?secret=${DOCKHAND_WEBHOOK_SECRET}")
          echo "Dockhand-Antwort: HTTP ${code}"
          cat /tmp/dockhand-webhook-response.json
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Dockhand-Redeploy fehlgeschlagen (HTTP ${code})"
            exit 1
          fi
